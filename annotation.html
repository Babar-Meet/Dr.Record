<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Record — Annotation</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #drawCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    /* Drawing toolbar: Dr.Player drawbar look (two rows, drag handle,
       tool shortcuts, swatches, size slider, undo/redo, clear, exit).
       Player-only seek/step controls are omitted: a live recording has no
       timeline to seek. Shown only while armed; hidden = click-through. */
    #annoToolbar {
      position: fixed;
      bottom: 24px; left: 50%; transform: translateX(-50%);
      display: none;
      flex-direction: row;
      align-items: stretch;
      z-index: 30;
      background: rgba(10,10,10,0.94);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 5px 8px 5px 3px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      font-family: "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #annoToolbar.open { display: flex; }
    .drawbar-body { display: flex; flex-direction: column; gap: 3px; }
    .drow { display: flex; align-items: center; justify-content: center; gap: 3px; }
    .dbtn svg { width: 14px; height: 14px; display: block; }
    .dhandle svg { width: 20px; height: 42px; display: block; }
    .dbtn .dkey { font-size: 9px; opacity: 0.55; margin-left: 2px; }
    .dbtn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.85);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
      line-height: 1;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
    }
    .dbtn:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .dbtn.active {
      background: rgba(255,80,80,0.35);
      border-color: rgba(255,100,100,0.5);
      color: #fff;
    }
    .dsep {
      width: 1px; height: 20px;
      background: rgba(255,255,255,0.15);
      margin: 0 4px;
      flex-shrink: 0;
    }
    .dhandle {
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      background: rgba(255,255,255,0.05);
      border: none;
      border-right: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.3);
      border-radius: 10px 4px 4px 10px;
      flex-shrink: 0;
      transition: all 0.15s;
      margin-right: 5px;
      min-width: 20px;
    }
    .dhandle:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.1); }
    .dhandle:active { cursor: grabbing; background: rgba(255,255,255,0.15); }
    .cswatch {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
      flex-shrink: 0;
    }
    .cswatch:hover { transform: scale(1.2); }
    .cswatch.sel { border-color: #fff; transform: scale(1.15); }
    #cpicker {
      width: 22px; height: 22px;
      padding: 0;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      cursor: pointer;
      background: none;
      flex-shrink: 0;
    }
    #cpicker::-webkit-color-swatch-wrapper { padding: 0; }
    #cpicker::-webkit-color-swatch { border: none; border-radius: 50%; }
    #csize {
      width: 50px;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    #csize::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff;
      border: none;
      cursor: pointer;
    }
    #annoTextInput {
      position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%);
      z-index: 31; display: none;
      background: rgba(28,28,28,0.95); color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px; padding: 8px 12px; font-size: 14px;
      font-family: "Segoe UI", sans-serif; width: 260px; outline: none;
    }
    #annoTextInput.visible { display: block; }
  </style>
</head>
<body>
  <canvas id="drawCanvas"></canvas>
  <!-- Inline label input for the text tool (T): Enter commits, Esc cancels.
       (Player uses a modal dialog; inline suits the fullscreen layer.) -->
  <input id="annoTextInput" placeholder="Label… (Enter to place, Esc to cancel)" maxlength="200" autocomplete="off" />
  <div id="annoToolbar">
    <button class="dhandle" title="Drag to move toolbar">
      <svg viewBox="0 0 20 42" fill="currentColor"><circle cx="5" cy="7" r="1.8"/><circle cx="15" cy="7" r="1.8"/><circle cx="5" cy="21" r="1.8"/><circle cx="15" cy="21" r="1.8"/><circle cx="5" cy="35" r="1.8"/><circle cx="15" cy="35" r="1.8"/></svg>
    </button>
    <div class="drawbar-body">
    <div class="drow">
      <button class="dbtn active" data-tool="pen" title="Pen (P)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2 2-9 9L2 13l1-3 9-8z"/><line x1="11" y1="3" x2="13" y2="5"/></svg><span class="dkey">/P</span>
      </button>
      <button class="dbtn" data-tool="line" title="Line (L)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="14" x2="14" y2="2"/></svg><span class="dkey">/L</span>
      </button>
      <button class="dbtn" data-tool="arrow" title="Arrow (A)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="14" x2="14" y2="2"/><path d="M14 2l-4 1M14 2l-1 4"/></svg><span class="dkey">/A</span>
      </button>
      <button class="dbtn" data-tool="rect" title="Rectangle (R)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12"/></svg><span class="dkey">/R</span>
      </button>
      <button class="dbtn" data-tool="circle" title="Circle (C)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/></svg><span class="dkey">/C</span>
      </button>
      <button class="dbtn" data-tool="hand" title="Hand — move marks (H)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a4 4 0 0 0 8 0"/><path d="M5 10V6.5M7 10V4.5M9 10V5.5M11 10V7"/></svg><span class="dkey">/H</span>
      </button>
      <div class="dsep"></div>
      <div class="cswatch sel" data-color="#ff0000" style="background:#ff0000" title="Red"></div>
      <div class="cswatch" data-color="#00ff00" style="background:#00ff00" title="Green"></div>
      <div class="cswatch" data-color="#0066ff" style="background:#0066ff" title="Blue"></div>
      <div class="cswatch" data-color="#ffff00" style="background:#ffff00" title="Yellow"></div>
      <div class="cswatch" data-color="#ffffff" style="background:#ffffff" title="White"></div>
      <div class="cswatch" data-color="#000000" style="background:#000000" title="Black"></div>
      <input type="color" id="cpicker" value="#ff0000" title="Custom color">
    </div>
    <div class="drow">
      <input type="range" id="csize" min="1" max="20" value="3" title="Stroke size">
      <div class="dsep"></div>
      <button class="dbtn" id="bundo" title="Undo (Mouse Back)">↩</button>
      <button class="dbtn" id="bredo" title="Redo (Mouse Forward)">↪</button>
      <button class="dbtn" id="bclear" title="Clear All (Ctrl+Backspace)">✕</button>
      <div class="dsep"></div>
      <button class="dbtn" id="exitDrawBtn" title="Exit draw mode (keeps marks)">✕ Exit</button>
    </div>
    </div>
  </div>
  <script type="module" src="/src/annotation.js"></script>
</body>
</html>
