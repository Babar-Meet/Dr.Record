<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Record — Overlay</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="overlay-body">
  <div class="overlay-pill" id="overlayPill">
    <button id="annotateBtn" class="annotate-btn annotate-icon-btn" type="button" title="Annotate (draw on screen)" aria-pressed="false" aria-label="Toggle annotation draw mode">
      <svg class="annotate-icon" width="13" height="13" viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false">
        <path d="M8.6 1.4l2 2L4.2 9.8l-2.7.7.7-2.7L8.6 1.4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" />
      </svg>
      <span id="armedDot" class="annotate-status" title="Annotation armed"></span>
    </button>
    <span class="pill-divider" aria-hidden="true"></span>
    <span class="rec-dot" id="recDot"></span>
    <span class="rec-label">REC</span>
    <span class="rec-time" id="recTime">00:00</span>
  </div>
  <script type="module" src="/src/overlay.js"></script>
</body>
</html>
