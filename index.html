<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Record — Settings</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="settings-body">
  <div class="settings-container">
    <div class="settings-header">
      <h1>Dr. Record</h1>
      <p class="subtitle">Screen recorder for Windows</p>
    </div>

    <div class="setting-group">
      <label class="setting-label">Output Directory</label>
      <div class="picker-row">
        <input type="text" id="outputDir" class="picker-input" readonly />
        <button id="pickDirBtn" class="btn btn-secondary">Browse</button>
      </div>
    </div>

    <div class="setting-group">
      <label class="setting-label">Start / Stop Hotkey</label>
      <div class="picker-row">
        <input type="text" id="hotkeyInput" class="picker-input hotkey-input" readonly placeholder="Press a key combination..." />
        <button id="captureHotkeyBtn" class="btn btn-secondary">Capture</button>
      </div>
      <p class="hint">Press the button then type your shortcut (e.g. Ctrl+Shift+Alt+R)</p>
    </div>

    <div class="setting-group">
      <label class="setting-label" for="sourceSelect">Recording Source</label>
      
      <!-- Live Preview Area -->
      <div id="sourcePreview" class="source-preview-container">
        <div class="source-preview-img-wrapper" id="previewImgWrapper">
          <div class="source-preview-placeholder">No preview</div>
        </div>
      </div>

      <div class="source-row">
        <select id="sourceSelect" class="picker-input select-input source-select">
          <option value="all">⊞  All Screens</option>
        </select>
        <button id="refreshSourcesBtn" class="btn btn-secondary btn-icon" title="Refresh sources">↺</button>
      </div>
      <p class="hint" id="sourceHint">Records the full virtual desktop (all monitors combined).</p>
    </div>

    <div class="setting-row">
      <div class="setting-group" style="flex:1">
        <label class="setting-label">Frame Rate</label>
        <select id="framerateSelect" class="picker-input select-input">
          <option value="0">Auto</option>
          <option value="24">24 FPS</option>
          <option value="30">30 FPS</option>
          <option value="60">60 FPS</option>
          <option value="120">120 FPS</option>
          <option value="144">144 FPS</option>
        </select>
      </div>
      <div class="setting-group" style="flex:1">
        <label class="setting-label">Quality</label>
        <select id="qualitySelect" class="picker-input select-input">
          <option value="low">Low (small file)</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="lossless">Lossless</option>
        </select>
      </div>
    </div>

    <!-- AUDIO SETTINGS -->
    <div class="setting-group">
      <label class="setting-label">
        <input type="checkbox" id="recordSystemAudio" checked />
        <span>Record System Audio</span>
      </label>
      <div class="audio-level-bar">
        <div class="audio-level-fill" id="sysAudioLevel" style="width: 0%"></div>
      </div>
    </div>

    <div class="setting-group">
      <label class="setting-label">Microphone</label>
      <div class="source-row">
        <select id="micSelect" class="picker-input select-input source-select">
          <option value="None">None</option>
        </select>
        <button id="refreshMicsBtn" class="btn btn-secondary btn-icon" title="Refresh Microphones">↺</button>
      </div>
      <div class="audio-level-bar" style="margin-top: 8px;">
        <div class="audio-level-fill" id="micAudioLevel" style="width: 0%"></div>
      </div>
    </div>

    <div class="setting-group">
      <label class="setting-label">
        <input type="checkbox" id="showOverlay" checked />
        <span>Show recording overlay</span>
      </label>
    </div>

    <div class="setting-group">
      <label class="setting-label">
        <input type="checkbox" id="autoStart" />
        <span>Run on Windows startup</span>
      </label>
    </div>

    <div class="display-info" id="displayInfo">Display: detecting...</div>

    <div class="settings-footer">
      <div class="status-row" id="statusRow">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Idle</span>
      </div>
      <div class="footer-actions">
        <button id="testRecBtn" class="btn btn-secondary">Test Record (5s)</button>
        <button id="saveBtn" class="btn btn-primary">Save &amp; Start</button>
      </div>
    </div>

    <div class="notification" id="notification"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
